; PlatformIO project skeleton — ESP32-S3 / Arduino / C++17
; Confirm the exact board ID against the physical ESP32-S3 board before deployment.
[platformio]
default_envs = esp32-s3-devkitc-1
build_dir = build_output

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -I include
    -I include/project
; Add verified library dependencies only after selecting concrete sensor/model libraries.
; monitor_speed = TBD

[env:esp32-s3-mock]
extends = env:esp32-s3-devkitc-1
build_flags =
    ${env:esp32-s3-devkitc-1.build_flags}
    -DPROJECT_MOCK_ENVIRONMENT=1
    -DPROJECT_TEST_ONLY=1

[env:mock-native]
platform = native
build_unflags = -std=gnu++11
build_flags =
    -std=c++17
    -I include
    -I include/project
    -DPROJECT_MOCK_NATIVE=1
build_src_filter =
    +<Drivers/MockSensors.cpp>
    +<Managers/SensorManager.cpp>
    +<mock_host_main.cpp>

[env:native-unit-tests]
platform = native
test_framework = unity
test_build_src = yes
build_unflags = -std=gnu++11
build_flags =
    -std=c++17
    -I include
    -I include/project
    -DPROJECT_HOST_DATA_TOOLS=1
build_src_filter =
    +<Managers/SensorManager.cpp>
    +<Managers/RiskManager.cpp>
    +<Services/DataQualityService.cpp>
    +<Services/FeaturePipeline.cpp>
    +<Replay/ReplayEngine.cpp>
    +<Dataset/CsvWriter.cpp>
    +<Dataset/Sha256.cpp>
    +<Dataset/DsdRawSampleCsvParser.cpp>
    +<Dataset/DatasetValidator.cpp>
    +<Dataset/SyntheticSensorGenerator.cpp>
    +<Dataset/EvaluationRunner.cpp>
test_filter = test_system_contracts

[env:native-integration-tests]
platform = native
test_framework = unity
test_build_src = yes
build_unflags = -std=gnu++11
build_flags =
    -std=c++17
    -I include
    -I include/project
    -DPROJECT_HOST_DATA_TOOLS=1
    -DPROJECT_TEST_ONLY=1
build_src_filter =
    +<Managers/SensorManager.cpp>
    +<Managers/RiskManager.cpp>
    +<Services/DataQualityService.cpp>
    +<Services/FeaturePipeline.cpp>
    +<Services/CalibrationService.cpp>
    +<AI/IInferenceEngine.cpp>
    +<AI/SchemaRegistry.cpp>
    +<AI/EdgeImpulseAdapter.cpp>
    +<AI/MockModelRuntime.cpp>
    +<Dataset/AnnotationManager.cpp>
    +<Dataset/CsvWriter.cpp>
    +<Dataset/DsdRawSampleCsvParser.cpp>
    +<Dataset/DsdRawSampleCsvExporter.cpp>
    +<Dataset/DatasetValidator.cpp>
    +<Dataset/EvaluationRunner.cpp>
    +<Dataset/Sha256.cpp>
    +<Dataset/SyntheticSensorGenerator.cpp>
    +<Drivers/MockCsvTelemetry.cpp>
    +<Storage/CsvLogger.cpp>
test_filter = test_system_flow
